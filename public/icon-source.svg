<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="OrbitSSH app icon">
  <defs>
    <linearGradient id="base" x1="168" y1="120" x2="866" y2="916" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#102c32"/>
      <stop offset=".48" stop-color="#07171d"/>
      <stop offset="1" stop-color="#03090d"/>
    </linearGradient>
    <linearGradient id="rim" x1="238" y1="194" x2="804" y2="836" gradientUnits="userSpaceOnUse">
      <stop stop-color="#72f2e5"/>
      <stop offset=".55" stop-color="#24bdb8"/>
      <stop offset="1" stop-color="#789cff"/>
    </linearGradient>
    <linearGradient id="prompt" x1="354" y1="410" x2="650" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f3fffd"/>
      <stop offset="1" stop-color="#a7ded9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(496 470) rotate(90) scale(390)">
      <stop stop-color="#35d9ce" stop-opacity=".18"/>
      <stop offset="1" stop-color="#35d9ce" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <filter id="cyanGlow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="104" y="104" width="816" height="816" rx="210" fill="url(#base)"/>
    <rect x="104" y="104" width="816" height="816" rx="210" fill="url(#glow)"/>
    <rect x="122" y="122" width="780" height="780" rx="192" fill="none" stroke="#d5fffa" stroke-opacity=".11" stroke-width="3"/>
    <path d="M202 218c162-74 391-89 594-18" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".08"/>

    <ellipse cx="512" cy="512" rx="302" ry="238" fill="none" stroke="#29545a" stroke-width="30" opacity=".52" transform="rotate(-18 512 512)"/>
    <ellipse cx="512" cy="512" rx="302" ry="238" fill="none" stroke="url(#rim)" stroke-width="18" stroke-linecap="round" stroke-dasharray="1260 320" transform="rotate(-18 512 512)"/>
    <ellipse cx="512" cy="512" rx="244" ry="316" fill="none" stroke="#6f97ff" stroke-opacity=".22" stroke-width="6" stroke-dasharray="46 24" transform="rotate(31 512 512)"/>

    <rect x="286" y="322" width="452" height="380" rx="96" fill="#061116" stroke="#76eee2" stroke-opacity=".28" stroke-width="5"/>
    <rect x="314" y="350" width="396" height="324" rx="72" fill="none" stroke="#fff" stroke-opacity=".055" stroke-width="3"/>
    <circle cx="352" cy="390" r="10" fill="#72f2e5" opacity=".78"/>
    <circle cx="386" cy="390" r="10" fill="#789cff" opacity=".62"/>
    <circle cx="420" cy="390" r="10" fill="#8af2c2" opacity=".66"/>

    <path d="M374 457 470 520 374 583" fill="none" stroke="url(#prompt)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M512 584h142" fill="none" stroke="#6ff2e2" stroke-width="48" stroke-linecap="round"/>

    <g filter="url(#cyanGlow)">
      <circle cx="258" cy="316" r="30" fill="#07181d" stroke="#7af4e7" stroke-width="11"/>
      <circle cx="258" cy="316" r="9" fill="#8af2c2"/>
      <circle cx="780" cy="673" r="34" fill="#07181d" stroke="#789cff" stroke-width="11"/>
      <circle cx="780" cy="673" r="10" fill="#9db6ff"/>
    </g>
